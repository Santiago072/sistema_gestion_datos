<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="senaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34b308"/>
      <stop offset="100%" stop-color="#196700"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fondo redondeado moderno con degradado verde SENA -->
  <rect width="64" height="64" rx="16" fill="url(#senaGrad)" filter="url(#glow)"/>

  <!-- Borde sutil interno -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Icono Birrete Académico / Evaluativo Estilizado (SENA Juicios) -->
  <g fill="#ffffff" transform="translate(4, 4)">
    <!-- Rombo superior del birrete -->
    <path d="M28 12 L48 22 L28 32 L8 22 Z" fill="#ffffff"/>
    
    <!-- Base inferior del birrete -->
    <path d="M14 26.5 V35 C14 39.5 20.3 43 28 43 C35.7 43 42 39.5 42 35 V26.5 L28 33.5 Z" fill="#f0fdf4"/>

    <!-- Cordón y borla lateral -->
    <path d="M44 24.5 V36" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="44" cy="38" r="2.5" fill="#facc15"/>

    <!-- Detalle de nodo/evaluación central -->
    <circle cx="28" cy="22" r="2" fill="#249400"/>
  </g>
</svg>
